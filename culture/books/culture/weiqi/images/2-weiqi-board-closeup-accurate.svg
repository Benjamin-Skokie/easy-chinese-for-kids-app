<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7E9C7"/>
      <stop offset="1" stop-color="#EED7AF"/>
    </linearGradient>
    <linearGradient id="wood" x1="160" y1="70" x2="1040" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2B96E"/>
      <stop offset="0.55" stop-color="#D4A557"/>
      <stop offset="1" stop-color="#C69045"/>
    </linearGradient>
    <radialGradient id="stoneBlack" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0.32 -0.35) scale(1.2)">
      <stop offset="0" stop-color="#5C6671"/>
      <stop offset="0.35" stop-color="#27303A"/>
      <stop offset="1" stop-color="#11161D"/>
    </radialGradient>
    <radialGradient id="stoneWhite" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0.28 -0.3) scale(1.15)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F7F4ED"/>
      <stop offset="1" stop-color="#D9D4CA"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7B5626" flood-opacity="0.28"/>
    </filter>
    <filter id="stoneShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#3A2813" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="180" y="60" width="840" height="780" rx="34" fill="url(#wood)"/>
    <rect x="215" y="95" width="770" height="710" rx="18" fill="none" stroke="#8D5D27" stroke-width="4"/>
  </g>

