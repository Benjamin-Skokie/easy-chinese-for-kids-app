name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository-relative paths
        run: npm run check:paths

      - name: Verify pushed commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check_relative_paths.mjs --commit-range "${{ github.event.before }}..${{ github.sha }}"

      - name: Build website
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude _site \
            --exclude books_pdf \
            --exclude generated \
            --exclude assets_archive \
            --exclude assets/_png-archive \
            --exclude docs \
            --exclude src \
            --exclude scripts \
            --exclude tests \
            --exclude tmp \
            --exclude culture/content \
            --exclude culture/experiments \
            ./ _site/
          test -z "$(find _site -type l -print -quit)"
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
