# Nihao World 网站 Bug / Content Notes（1–20）

## 1. 郑和下西洋：帽子不一致
- 郑和在几张图片里的帽子不一致。
- 尤其是第三张图，帽子突然变成了一个明显的 **M 型**。
- 需要统一郑和在整篇故事里的帽子造型。

## 2. 曹操：人物长相和帽子不一致
- 第一张图和第三张图里的曹操看起来不像同一个人。
- 帽子也不一致：
  - 第一张是平顶。
  - 第二、第三张是往上圆起来的。
- 画质方面，第三张稍微好一些，第一张质量比较差。
- 需要统一曹操的人物形象和帽子。

## 3. 《皇帝为什么穿黄色》：主题、服装和建筑时代不匹配
- 页面提出的问题是：**“为什么偏偏是黄色？”**
- 但配图里的皇帝礼服并不是以黄色为主，反而主要是黑色和红色。
- 皇帝的服装看起来更像秦始皇时期的服饰。
- 但后面的宫殿又很像故宫。
- 整体存在时代混搭，而且没有突出“黄色”这个主题。
- 需要重新调整图片，使服装、时代背景和“皇帝为什么穿黄色”的主题一致。

## 4. 《端午节赛龙舟与屈原》：寻找屈原时不应该再出现屈原
- 对应文字是：**传说中人们急忙划船寻找屈原，一边敲鼓一边呐喊。**
- 现在画面里：
  - 船上有很多人；
  - 水里还有一个人；
  - 岸上也有很多人；
  - 岸上同时还出现了屈原，看起来像大家正在劝他“不要跳河”。
- 但按照这里的情节，屈原应该已经跳入河中，大家正在寻找他。
- 应该删除岸上的屈原。
- 更合适的画面是：河面上和岸边的人都很着急，正在寻找某个人。

## 5. 《十二生肖》：删除最后一张图
- 最后一张图里的玉皇大帝和第二张图里的玉皇大帝完全不像同一个人。
- 不需要继续修改这张图。
- **直接删除最后一张图片。**

## 6. 《龙和凤凰：中国最吉祥的伙伴》：description 太啰嗦 + 人物视线不自然
- 第二张图是分屏画面，本身挺有意思。
- 现在的 description 类似：
  - “分屏画面把龙、雨水、农田和皇帝的象征联系放在一起，并不表现某一位具体皇帝或某一次历史事件。”
- 这个 description 太啰嗦。
- 应该有什么说什么，直接描述画面内容即可，不需要加“并不表现某一次具体历史事件”之类的解释。
- 第四张图里，舞龙和凤纹婚服并排出现，也应该直接简洁描述画面。
- 婚礼相关图片里，大家似乎都在盯着新娘背后的图案看，而不是看新娘本人。
- 这个人物视线和构图很奇怪，需要让新娘成为自然的视觉中心。

## 7. 《汉字是画出来的吗？》：第一张图不应该是中药铺
- 第一张图现在把背景画成了传统中药铺，这会造成误导。
- 不应该让孩子以为王懿荣是在中药铺里发现或研究刻有文字的“龙骨”。
- 更合适的场景是：
  - **清代末年**
  - **一个学者在自己家里的书房中**
  - 正在查看刻有文字的龙骨
- 背景尽量简单：
  - 书桌
  - 书架
- 不要额外添加卷轴、笔墨、砚台等太多道具，东西越多越容易画错。

## 8. 《功夫：像风一样快，像山一样稳》：Page 2 的“少林”加站内链接
- Page 2 / 第二段提到了“少林”。
- 我们网站已经有专门讲少林寺 / 少林武功的文章。
- 应该在“少林”这里加一个站内 link，链接到对应的少林文章。

## 9. 《火药的发明：从炼丹炉到烟花》Page 4：火箭画错了
- Page 4 / 第四张图用“普通弓箭”和“火药推进装置”并排解释原理。
- 但现在图里的火箭形象不对。
- 应该按照提供的参考图重新画。
- 正确方向应更接近：
  - 一根长杆 / 箭体；
  - 装有火药推进装置；
  - 有人点燃引线；
  - 重点表现火药推进，而不是画成一个随意的现代感“火箭”。

## 10. 《火药的发明：从炼丹炉到烟花》Page 3：整张图删除
- Page 3 当前把一种管状喷火武器和后来的火器并排放在一起。
- 这种画法很容易让读者误以为它们是在同一时期同时出现的。
- 实际上它们属于不同的发展阶段。
- 这个表达非常 confusing / misleading。
- **不需要修改 description，整张图直接删除。**

## 11. 《纸是怎么从树皮变出来的？》：最后一张图改成驼队运输纸
- 现在最后一张图里有一支驼队，同时有一个人站在旁边看书。
- 这个构图很奇怪，也不自然。
- 应该直接改成：
  - 一支驼队；
  - 驼队上装载纸张、纸卷或卷起来的书页。
- 重点表现纸随着旅行和交流被带到远方。
- 不要再放一个人站在驼队旁边看书。

## 12. 《指南针为什么总朝同一个方向》：最后一张图应该移到开头
- 现在最后一张图画的是：
  - 乌云遮住天空；
  - 船员需要辨认方向。
- 但这张图放在故事最后不合理。
- 到了这里，文章已经讲过指南针，孩子会自然地问：**“那他们为什么不用指南针？”**
- 这张图更适合移到故事开头，用来提出问题：
  - 天气不好；
  - 看不到明显方向；
  - 所以人们需要一种可靠的辨向工具。
- description 里“画面并不表示某一次具体的宋代航行”这种说明也很奇怪，可以删掉。

## 13. 《古代战船：当战场来到水上》Page 5：尽量避免中文 em dash
- 原句：**“于是利用了木船最怕的东西之一——火。”**
- “一”和后面的中文长破折号 **——** 连在一起，视觉上非常难看懂。
- 这种地方尽量避免使用 em dash / 中文长破折号。
- 可以改成普通标点，或者直接改写句子。
- 以后中文故事正文里，如果破折号会造成视觉混淆，也尽量不用。

## 14. 《古代市场：从赶集日到夜市》Page 4：鬼市子文图不符
- 这一页文字讲的是“鬼市子”：
  - 天还黑着的时候就开市；
  - 等太阳升起来时已经散了。
- 但现在配图却是大白天：
  - 一个挑着两篮货物的小贩从店铺前走过；
  - 向街边的母子吆喝。
- 这个画面更像普通白天街市，和“鬼市子”完全不符。
- 应该改成：
  - 天还没亮，或者刚刚蒙蒙亮；
  - 一个短暂开张、即将散去的早市 / 鬼市子场景。

## 15. 《古代的钱为什么有这么多样子》：第二张图 description 不要写“一个孩子在看”
- 当前 description 类似：
  - “一个孩子看着海贝、刀币、布币和圆形钱币，发现古代的钱可以有完全不同的形状。”
- 这里没必要因为画面里有一个孩子，就把“一个孩子在看”写进 description。
- description 应该直接讲文化内容本身。
- 例如：
  - **“海贝、刀币、布币和圆形钱币放在一起，可以看出古代的钱有各种不同的形状。”**

