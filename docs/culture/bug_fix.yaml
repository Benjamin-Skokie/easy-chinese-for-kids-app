## 33. 《孔子：一个可以问一辈子的问题》
- **结尾的表达不准确 / 容易误导**
  - 现在类似：**“一个字，一辈子 / One word, one lifetime”**
  - 问题在于：子贡问的并不是“一个汉字”，而更接近“有没有一句话、一个原则、一个可以终身遵循的准则”
  - 现在这种写法容易让孩子误解为：子贡问的是“有没有一个字可以管一辈子”
- 建议：
  - 考虑改成更准确、对孩子更清楚的说法，例如：
    - **“一个原则，可以用一辈子吗？”**
    - 或英文 **“One principle for a lifetime?”**
- **最后一张图不清楚在表达什么**
  - 现在是竹卷摊开，旁边放着灯、毛笔和砚台
  - 这只是一个 generic ancient writing still life，**没有把正文重点画出来**
- 正文真正想讲的是：
  - **《论语》不是孔子自己坐下来写成的一本书**
  - 而是孔子的言语、对话和故事，后来由弟子及后学**记录、整理、编纂**而成
- 建议把最后一张图改成：
  - **几位孔门弟子或后来的门人坐在一起**
  - **有人在竹简上记录孔子的言语**
  - 其他人在旁边讨论、整理竹简
  - 这样才真正对应正文。

---

## 34. 《道德经》第六十四章相关那篇文章
- **文章过度强调 chapter number**
  - 现在反复出现“第六十四章”“第六十五章”之类的说法。
  - 对 6–10 岁小朋友来说，这些编号没有明显意义，反而会让人困惑：
    - 为什么偏偏是六十四？
    - 六十五又有什么意义？
- 建议：
  - 除非文章目的就是介绍《道德经》的篇章结构，否则不要强调 chapter number
  - 例如：
    - “第六十四章还说到……”
      可改为
      **“《道德经》里还说到……”**
    - 或
      **“老子还提醒人们……”**
- 重点应放在：
  - **这些话想告诉我们什么**
  - 而不是它们排在第几章

### Page 5 最后一张图也有问题
- 正文这里讲的是：
  - **“让树按照树的方式长 / Let it be a tree.”**
- 但配图却是：
  - **一双大手和一双小手一起把种子放进湿润的泥土里**
- 问题：
  - 这张图更像表达“种下种子”或“共同栽种”
  - **并没有真正对应正文“顺其自然成长”的意思**
- 建议：
  - 更换成更能表现“不要急着控制、催促或强行塑造，让事物按自己的规律成长”的画面。

